name: Update fun fact

on:
  schedule:
    - cron: "0 12 * * *"   # daily at 12:00 UTC
  workflow_dispatch:        # lets you run it manually

permissions:
  contents: write           # needed so it can commit the README change

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch fact and update README
        run: |
          FACT=$(curl -s "https://uselessfacts.jsph.pl/api/v2/facts/random?language=en" | jq -r '.text')
          python3 - "$FACT" <<'EOF'
          import re, sys
          fact = sys.argv[1]
          text = open("README.md", encoding="utf-8").read()
          new = re.sub(
              r"(<!-- FACT:START -->).*?(<!-- FACT:END -->)",
              lambda m: f"{m.group(1)}\n> {fact}\n{m.group(2)}",
              text, flags=re.DOTALL)
          open("README.md", "w", encoding="utf-8").write(new)
          EOF

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update fun fact"
          git push
